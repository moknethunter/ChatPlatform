# fly.toml app configuration file generated for chatplatform on 2026-11-18T21:52:30Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'chatplatform'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'data'
  destination = '/data'

[env]
  CHATPLATFORM_DATA_DIR = '/data'
  ConnectionStrings__DefaultConnection = 'Data Source=/data/platform.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
