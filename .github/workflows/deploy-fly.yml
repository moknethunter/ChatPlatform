name: Deploy ChatPlatform to Fly.io

on:
  workflow_dispatch:
  # Require an explicitly approved deployment marker in a main commit.
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-fly.yml']

permissions:
  contents: read
concurrency:
  group: chatplatform-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-fly-approved]'))
    uses: ./.github/workflows/isolated-verification.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check existing app status
        run: flyctl status --app chatplatform
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app chatplatform --build-arg APP_REVISION="$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployed revision and database connectivity
        run: python3 scripts/check_deployment.py --expected-revision "$GITHUB_SHA" --attempts 12
