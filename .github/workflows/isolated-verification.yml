name: Isolated build and smoke checks
on:
  workflow_call:
  push:
    branches: ['development/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Compose syntax (no deployment)
        run: docker compose -f docker-compose.yml config --quiet
      - name: Static UI integrity (Node syntax and local links)
        run: python3 tests/check_web_assets.py
      - name: Million-tenant directory index benchmark (synthetic, isolated)
        run: python3 tests/tenant_directory_scale.py 1000000
      - name: Restore
        run: dotnet restore ChatPlatform.csproj
      - name: Audit dependency vulnerabilities (report)
        run: dotnet list ChatPlatform.csproj package --vulnerable --include-transitive
      - name: Build
        run: dotnet build ChatPlatform.csproj -c Release --no-restore
      - name: Smoke checks (disposable database; no external credentials)
        shell: bash
        run: |
          set -euo pipefail
          export CHATPLATFORM_DATA_DIR="$RUNNER_TEMP/chatplatform-smoke"
          mkdir -p "$CHATPLATFORM_DATA_DIR"
          export ConnectionStrings__DefaultConnection="Data Source=$CHATPLATFORM_DATA_DIR/platform.db"
          export ASPNETCORE_ENVIRONMENT=Production
          export Campaigns__Enabled=true # disposable CI only; future-scheduled fake recipients
          export ASPNETCORE_URLS=http://127.0.0.1:5080
          export CHATPLATFORM_REVISION="$GITHUB_SHA"
          export WHATSAPP_VERIFY_TOKEN=ci-only-test-token
          export WHATSAPP_APP_SECRET=ci-only-test-secret
          # Simulate an older persistent volume with nullable account metadata.
          export WHATSAPP_PHONE_NUMBER_ID=999999999998
          export WHATSAPP_TENANT_ID=tenant-alhawbani-001
          export WHATSAPP_TOKEN=ci-only-bootstrap-token
          python3 - "$CHATPLATFORM_DATA_DIR/platform.db" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              db.executescript("""
                  CREATE TABLE WhatsAppTenants (
                      Id TEXT NOT NULL PRIMARY KEY, TenantId TEXT NOT NULL,
                      PhoneNumberId TEXT NOT NULL, DisplayPhoneNumber TEXT,
                      BusinessName TEXT, AccessTokenEncrypted TEXT, VerifyToken TEXT,
                      IsActive INTEGER NOT NULL, CreatedAtUtc TEXT NOT NULL,
                      WabaId TEXT, AppId TEXT, BusinessTokenEncrypted TEXT, CreatedAt TEXT
                  );
                  INSERT INTO WhatsAppTenants (Id, TenantId, PhoneNumberId, IsActive, CreatedAtUtc)
                  VALUES ('ci-legacy-account', 'tenant-alhawbani-001', '999999999998', 1, '2026-01-01');
              """)
          PY
          # Disposable external ERP fixture; no vendor or real customer data.
          export ConnectionStrings__CiErp="Data Source=$CHATPLATFORM_DATA_DIR/erp-fixture.db"
          python3 - "$CHATPLATFORM_DATA_DIR/erp-fixture.db" <<'PY'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              db.execute("CREATE TABLE Invoices(Id TEXT PRIMARY KEY, AmountMinor INTEGER NOT NULL)")
              db.execute("INSERT INTO Invoices VALUES ('ci-invoice',12500)")
          PY
          eval "$(python3 tests/security_smoke.py --environment)"
          # env accepts hyphenated configuration keys that Bash export rejects.
          env \
            ExternalDatabases__Tenants__ci-tenant-a__erp__Provider=sqlite \
            ExternalDatabases__Tenants__ci-tenant-a__erp__ConnectionName=CiErp \
            ExternalDatabases__Tenants__ci-tenant-a__erp__Reads__invoice="SELECT json_object('reference',Id,'amountMinor',AmountMinor,'currency','YER','status','open') FROM Invoices WHERE Id=@input" \
            BusinessIntegrations__Tenants__ci-tenant-a__accounting__Provider=database \
            BusinessIntegrations__Tenants__ci-tenant-a__accounting__DatabaseAlias=erp \
            BusinessIntegrations__Tenants__ci-tenant-a__accounting__Operations__invoice=invoice \
            dotnet run --project ChatPlatform.csproj -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/chatplatform-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/chatplatform-smoke.log"' EXIT
          ready=false
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5080/health > /dev/null; then ready=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          test "$ready" = true
          base=http://127.0.0.1:5080
          python3 scripts/check_deployment.py --base-url "$base" --expected-revision "$GITHUB_SHA" --attempts 1
          python3 tests/security_smoke.py
          python3 tests/backup_smoke.py
      - name: Manual send and auto-reply through mocked Graph API
        run: dotnet run --project tests/MessagingSmoke/MessagingSmoke.csproj -c Release

      - name: Container build and network-isolated healthcheck
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg APP_REVISION="$GITHUB_SHA" -t chatplatform-ci:local .
          name=chatplatform-ci-health
          trap 'docker logs "$name" || true; docker rm -f "$name" || true' EXIT
          docker run -d --network none --name "$name" \
            -e CHATPLATFORM_DATA_DIR=/app/data \
            -e 'ConnectionStrings__DefaultConnection=Data Source=/app/data/platform.db' \
            -e WhatsApp__AccessToken= -e WhatsApp__PhoneNumberId= \
            -e WhatsApp__VerifyToken= -e WhatsApp__AppSecret= \
            -e OwnModel__Enabled=false -e Campaigns__Enabled=false \
            chatplatform-ci:local
          for i in {1..60}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy ]; then
              docker exec "$name" printenv CHATPLATFORM_REVISION | grep -Fx "$GITHUB_SHA"
              echo 'PASS: built container reports healthy using its actual Docker healthcheck'
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$name")" != true ]; then break; fi
            sleep 2
          done
          exit 1
