version: "3.9"

services:
  chatplatform:
    image: ghcr.io/moknethunter/chat55d:latest
    container_name: chatplatform
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - CHATPLATFORM_DATA_DIR=/app/data
      - CHATPLATFORM_ALLOW_EPHEMERAL_DB=false
      # إعدادات WhatsApp (املأ القيم)
      - WhatsApp__AppSecret=${WHATSAPP_APPSECRET}
      - WhatsApp__VerifyToken=${WHATSAPP_VERIFY_TOKEN}
      - WhatsApp__PhoneNumberId=${WHATSAPP_PHONE_NUMBER_ID}
      - WhatsApp__AccessToken=${WHATSAPP_ACCESS_TOKEN}
    volumes:
      - chatplatform-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chatplatform-data:
    driver: local
