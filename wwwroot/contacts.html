<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة العملاء | ChatPlatform</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f3f6f5;color:#17392e;font-family:system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:20px 16px}nav{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:18px}a{color:#176b50}h1,h2,p{margin:0 0 12px}h1{font-size:1.6rem}h2{font-size:1.1rem}.panel{background:white;border:1px solid #dce8e1;border-radius:14px;padding:16px;min-width:0}.grid{display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2fr);gap:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}input,select,textarea,button{font:inherit;border:1px solid #b7c9c0;border-radius:8px;padding:10px;min-width:0}input,textarea,select{background:white;color:inherit}button{cursor:pointer;background:#176b50;color:white;border-color:#176b50}button.alt{background:white;color:#176b50}button:disabled{opacity:.5;cursor:default}label{display:block;font-size:.9rem;margin:12px 0 5px}form input,form textarea,form select{width:100%}.muted{color:#567267;font-size:.88rem}.entry{display:block;width:100%;text-align:right;background:white;color:#17392e;border:0;border-bottom:1px solid #dce8e1;border-radius:0;padding:14px 8px;overflow-wrap:anywhere}.entry:hover,.entry.selected{background:#e7f3ed}.entry strong{display:block}.pager{display:flex;gap:8px;align-items:center;margin-top:12px}.messages{height:420px;overflow:auto;background:#eaf0ed;padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:84%;align-self:flex-start;background:white;border-radius:12px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.out{align-self:flex-end;background:#d5efdf}.bubble small{display:block;color:#547366;margin-top:5px}.chatTitle{overflow-wrap:anywhere}.status{min-height:1.5em;color:#6e3a23}@media(max-width:720px){.grid{grid-template-columns:1fr}.messages{height:330px}main{padding:12px}.toolbar input{width:100%}}</style><link rel="stylesheet" href="/platform.css"></head><body class="cp-app"><main>
<nav><a href="/index.html">لوحة التحكم</a><a href="/inbox.html">المحادثات</a><a href="/contacts.html">العملاء</a></nav><h1>إدارة العملاء CRM</h1><p class="muted">تظهر جهات الاتصال من المحادثات تلقائيًا، ويمكن إضافة ملفات عملاء يدويًا.</p><p id="status" class="status" role="status"></p>
<div class="grid"><section class="panel"><h2>قائمة العملاء</h2><div class="toolbar"><input id="search" placeholder="بحث بالاسم أو الرقم أو البريد أو الوسم" aria-label="بحث"><select id="stage" aria-label="مرحلة العميل"><option value="">كل المراحل</option><option value="new">جديد</option><option value="lead">مهتم</option><option value="customer">عميل</option><option value="inactive">غير نشط</option></select><button id="filter">بحث</button><button id="new" class="alt">إضافة عميل</button></div><div id="list"></div><div class="pager"><button id="prev" class="alt">السابق</button><span id="page"></span><button id="next" class="alt">التالي</button></div></section>
<section class="panel"><h2 id="title">ملف العميل</h2><form id="form"><label>رقم الهاتف الدولي</label><input name="phone" required pattern="[1-9][0-9]{6,14}" maxlength="15" dir="ltr"><label>الاسم</label><input name="displayName" maxlength="100"><label>البريد الإلكتروني</label><input name="email" type="email" maxlength="254"><label>مرحلة العميل</label><select name="stage"><option value="new">جديد</option><option value="lead">مهتم</option><option value="customer">عميل</option><option value="inactive">غير نشط</option></select><label>الوسوم</label><input name="tags" maxlength="300"><label>ملاحظات داخلية</label><textarea name="notes" rows="5" maxlength="4000"></textarea><div class="toolbar"><button type="submit">حفظ</button><a id="chat" hidden href="/inbox.html">عرض المحادثات</a></div></form><section id="activity" hidden aria-label="سجل العميل"><hr><h2>سجل التعاملات</h2><p id="activitySummary" class="muted" role="status"></p><div id="activityConversations"></div><h2>آخر الرسائل (حتى 30)</h2><div id="activityMessages"></div><div id="consentPanel" hidden><h2>الموافقة التسويقية لكل رقم</h2><p class="muted">عدم وجود موافقة مسجلة لا يسمح بالإرسال التسويقي.</p><div id="activityConsent"></div></div></section></section></div>
</main><script src="/api.js"></script><script>
(()=>{const $=id=>document.getElementById(id),api=window.ChatPlatformAPI,form=$("form");let page=1,editing=null,generation=0,listGeneration=0,searchTimer=null;const stages={new:"جديد",lead:"مهتم",customer:"عميل",inactive:"غير نشط"};const status=t=>$("status").textContent=t;
function reset(){generation++;editing=null;form.reset();form.phone.readOnly=false;$("title").textContent="عميل جديد";$("chat").hidden=true;$("activity").hidden=true;}
async function load(){const token=++listGeneration;try{const result=await api.getContacts({search:$("search").value.trim(),stage:$("stage").value,page,limit:25});if(token!==listGeneration)return;$("list").replaceChildren();for(const c of result.items){const b=document.createElement("button");b.className="entry";const name=document.createElement("strong");name.textContent=c.displayName||c.phone;const sub=document.createElement("span");sub.className="muted";sub.textContent=c.phone+" · "+(stages[c.stage]||c.stage);b.append(name,sub);b.onclick=()=>open(c.phone);$("list").append(b);}if(!result.items.length)$("list").textContent="لا توجد نتائج.";$("page").textContent=page+" / "+Math.max(1,Math.ceil(result.total/25));$("prev").disabled=page===1;$("next").disabled=page*25>=result.total;}catch(e){if(token===listGeneration)status(e.message);}}
async function open(phone){const token=++generation;$("activity").hidden=true;try{const c=await api.getContact(phone);if(token!==generation)return;editing=c.phone;for(const key of ["phone","displayName","email","stage","tags","notes"])form.elements[key].value=c[key]||"";form.phone.readOnly=true;$("title").textContent=c.displayName||c.phone;$("chat").href="/inbox.html?phone="+encodeURIComponent(c.phone);$("chat").hidden=false;await activity(c.phone,token);}catch(e){if(token===generation)status(e.message);}}
function line(parent, title, detail){const row=document.createElement("div");row.className="entry";const strong=document.createElement("strong");strong.textContent=title;const sub=document.createElement("span");sub.className="muted";sub.textContent=detail;row.append(strong,sub);parent.append(row);return row;}
const date=value=>value?new Date(value).toLocaleString("ar"):"—";
async function activity(phone,token){
 const panel=$("activity");panel.hidden=false;$("activitySummary").textContent="جارٍ تحميل السجل…";
 for(const id of ["activityConversations","activityMessages","activityConsent"])$(id).replaceChildren();
 $("consentPanel").hidden=true;
 try{
  const data=await api.getContactActivity(phone);if(token!==generation)return;
  $("activitySummary").textContent="المحادثات: "+data.conversationCount+" · المفتوحة: "+data.openConversationCount+" · عرض آخر 50 محادثة";
  for(const c of data.conversations){
   const row=line($("activityConversations"),"رقم الأعمال: "+c.phoneNumberId,(c.status==="open"?"مفتوحة":"مغلقة")+" · "+(c.assignedToUserId||"غير مسندة")+" · "+(c.automationMode==="human"?"موظف":"بوت")+" · "+c.unreadCount+" غير مقروءة");
   const link=document.createElement("a");link.href="/inbox.html?phone="+encodeURIComponent(phone);link.textContent="عرض المحادثات";row.append(document.createElement("br"),link);
  }
  if(!data.conversations.length)$("activityConversations").textContent="لا توجد محادثات.";
  for(const m of data.recentMessages)line($("activityMessages"),(m.direction==="Inbound"?"واردة":"صادرة")+" · "+(m.textPreview||"["+m.messageType+"]"),date(m.timestampUtc)+" · "+m.status+" · "+m.phoneNumberId);
  if(!data.recentMessages.length)$("activityMessages").textContent="لا توجد رسائل.";
  if(Array.isArray(data.consent)){
   $("consentPanel").hidden=false;
   for(const c of data.consent)line($("activityConsent"),c.phoneNumberId,c.granted===true?"موافقة مسجلة · "+date(c.updatedAtUtc):c.granted===false?"مرفوضة / ملغاة · "+date(c.updatedAtUtc):"لا توجد موافقة مسجلة");
   if(!data.consent.length)$("activityConsent").textContent="لا توجد أرقام أعمال نشطة.";
  }
 }catch(e){if(token===generation)$("activitySummary").textContent="تعذر تحميل السجل.";}
}
form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector("button");b.disabled=true;const token=generation, target=editing,data=Object.fromEntries(new FormData(form));try{const saved=target?await api.updateContact(target,data):await api.createContact(data);status("تم حفظ العميل.");if(token===generation)await open(saved.phone);await load();}catch(err){status(err.message);}finally{b.disabled=false;}};
$("search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;load();},300);});$("stage").onchange=()=>{page=1;load();};$("new").onclick=reset;$("filter").onclick=()=>{page=1;load();};$("prev").onclick=()=>{if(page>1){page--;load();}};$("next").onclick=()=>{page++;load();};reset();load();const phone=new URLSearchParams(location.search).get('phone');if(phone)open(phone);})();
</script></body></html>
