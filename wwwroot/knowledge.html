<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قاعدة المعرفة | ChatPlatform</title><link rel="stylesheet" href="/platform.css"><style>
.kb-grid{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2fr);gap:14px;margin-top:16px}.kb-grid section{padding:20px;min-width:0}.kb-grid input:not([type=checkbox]),.kb-grid textarea{width:100%;padding:10px;border:1px solid #bccbd6;font:inherit;box-sizing:border-box}.kb-grid button{font:inherit;padding:8px 14px;border:1px solid;cursor:pointer;margin:5px 0}.kb-row{display:block;text-align:right;width:100%;padding:12px!important;border:0!important;border-bottom:1px solid #dbe4ed!important;border-radius:0!important;overflow-wrap:anywhere}.kb-result{padding:12px;background:#f2f7f5;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.kb-formbar{display:flex;gap:8px;flex-wrap:wrap}.kb-grid h2{margin:0 0 12px;font-size:1.15rem}@media(max-width:760px){.kb-grid{grid-template-columns:1fr}}
</style></head><body class="cp-app"><main><div class="cp-hero"><h1>قاعدة المعرفة</h1><p>معلومات مؤسستك، جاهزة للنموذج الخاص بك دون مزود خارجي.</p></div><p id="status" role="status" class="muted"></p><div id="workspace" hidden>
<div class="kb-grid"><section><h2>المقالات</h2><button id="new">+ إضافة مقال</button><div id="list"></div></section><section><h2 id="title">مقال جديد</h2><form id="article"><label class="cp-label">العنوان<input name="title" maxlength="150" required></label><label class="cp-label">المحتوى<textarea name="body" rows="8" maxlength="8000" required></textarea></label><label><input type="checkbox" name="isPublished"> نشر المقال ضمن قاعدة المعرفة</label><div class="kb-formbar"><button type="submit">حفظ</button><button type="button" class="alt" id="delete" hidden>حذف المقال</button></div></form></section></div>
<div class="kb-grid"><section><h2>النموذج الخاص</h2><p id="model" class="muted">جارٍ الفحص...</p><p class="muted">لا توجد اشتراكات ذكاء اصطناعي خارجية. الاتصال يُضبط من إعدادات الخادم فقط، وليس من حساب العميل.</p></section><section><h2>مختبر المعرفة</h2><label class="cp-label" for="question">سؤال اختباري (لا تستخدم بيانات عميل حقيقية)</label><textarea id="question" maxlength="2000" rows="3"></textarea><div class="kb-formbar"><button id="search">بحث محلي</button><button id="preview" class="alt" disabled>اختبار النموذج الخاص</button></div><div id="result" class="kb-result" aria-live="polite">ستظهر نتائج البحث هنا.</div></section></div></div></main><script src="/api.js"></script><script>
(()=>{const api=window.ChatPlatformAPI,$=id=>document.getElementById(id),form=$("article");let id=null,version=0,busy=false,generation=0;const status=t=>$("status").textContent=t;
function reset(){generation++;id=null;version=0;form.reset();$("title").textContent="مقال جديد";$("delete").hidden=true;}
async function load(){const items=await api.knowledgeList();$("list").replaceChildren();for(const item of items){const b=document.createElement("button");b.type="button";b.className="alt kb-row";b.textContent=item.title+" · "+(item.isPublished?"منشور":"مسودة");b.onclick=()=>open(item.id);$("list").append(b);}if(!items.length)$("list").textContent="لا توجد مقالات بعد.";}
async function open(key){if(busy)return;const g=++generation;try{const item=await api.knowledgeGet(key);if(g!==generation)return;id=item.id;version=item.version;form.elements.title.value=item.title;form.elements.body.value=item.body;form.elements.isPublished.checked=item.isPublished;$("title").textContent=item.title;$("delete").hidden=false;}catch(e){status(e.message);}}
$("new").onclick=()=>{if(!busy)reset();};form.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const b=form.querySelector('button[type="submit"]');b.disabled=true;try{const item=await api.knowledgeSave(id,{title:form.elements.title.value,body:form.elements.body.value,isPublished:form.elements.isPublished.checked,version});id=item.id;version=item.version;$("title").textContent=form.elements.title.value;$("delete").hidden=false;status("تم الحفظ.");await load();}catch(err){status(err.message);}finally{busy=false;b.disabled=false;}};
$("delete").onclick=async()=>{if(busy||!id||!confirm("حذف المقال نهائيًا؟"))return;busy=true;try{await api.knowledgeDelete(id,version);reset();await load();status("تم حذف المقال.");}catch(e){status(e.message);}finally{busy=false;}};
$("search").onclick=async()=>{try{const data=await api.knowledgeSearch($("question").value);$("result").textContent=data.length?data.map(x=>x.title+"\n"+x.body).join("\n\n"):"لا توجد نتائج مطابقة.";}catch(e){$("result").textContent=e.message;}};
$("preview").onclick=async()=>{const btn=$("preview");btn.disabled=true;try{const r=await api.modelPreview($("question").value);$("result").textContent=r.answer+"\n\nالمصادر: "+r.sources.map(s=>s.title).join("، ");}catch(e){$("result").textContent=e.message;}finally{btn.disabled=false;}};
(async()=>{try{const user=await api.getIdentity();if(user.role!=="Admin"){status("هذه الصفحة مخصصة للمدير.");return;}reset();await load();const m=await api.modelStatus();$("model").textContent=m.configured?"تم ضبط الاتصال؛ لم يختبر بعد.":"غير متصل — في انتظار نموذجك الخاص.";$("preview").disabled=!m.configured;$("workspace").hidden=false;}catch(e){status(e.message);}})();})();
</script></body></html>
