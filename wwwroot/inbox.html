<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صندوق المحادثات | ChatPlatform</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f3f6f5;color:#17392e;font-family:system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:20px 16px}nav{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:18px}a{color:#176b50}h1,h2,p{margin:0 0 12px}h1{font-size:1.6rem}h2{font-size:1.1rem}.panel{background:white;border:1px solid #dce8e1;border-radius:14px;padding:16px;min-width:0}.grid{display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2fr);gap:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}input,select,textarea,button{font:inherit;border:1px solid #b7c9c0;border-radius:8px;padding:10px;min-width:0}input,textarea,select{background:white;color:inherit}button{cursor:pointer;background:#176b50;color:white;border-color:#176b50}button.alt{background:white;color:#176b50}button:disabled{opacity:.5;cursor:default}label{display:block;font-size:.9rem;margin:12px 0 5px}form input,form textarea,form select{width:100%}.muted{color:#567267;font-size:.88rem}.entry{display:block;width:100%;text-align:right;background:white;color:#17392e;border:0;border-bottom:1px solid #dce8e1;border-radius:0;padding:14px 8px;overflow-wrap:anywhere}.entry:hover,.entry.selected{background:#e7f3ed}.entry strong{display:block}.pager{display:flex;gap:8px;align-items:center;margin-top:12px}.messages{height:420px;overflow:auto;background:#eaf0ed;padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:84%;align-self:flex-start;background:white;border-radius:12px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.out{align-self:flex-end;background:#d5efdf}.bubble small{display:block;color:#547366;margin-top:5px}.chatTitle{overflow-wrap:anywhere}.status{min-height:1.5em;color:#6e3a23}@media(max-width:720px){.grid{grid-template-columns:1fr}.messages{height:330px}main{padding:12px}.toolbar input{width:100%}}</style></head><body><main>
<nav><a href="/index.html">لوحة التحكم</a><a href="/contacts.html">إدارة العملاء</a><a href="/whatsapp.html">حسابات واتساب</a></nav><h1>صندوق المحادثات المشترك</h1><p id="status" class="status" role="status"></p>
<div class="grid"><section class="panel"><h2>المحادثات</h2><div class="toolbar"><input id="search" placeholder="بحث بالاسم أو الرقم" aria-label="بحث"><select id="state" aria-label="حالة المحادثة"><option value="">جميع الحالات</option><option value="open">مفتوحة</option><option value="closed">مغلقة</option></select><select id="assignedFilter" aria-label="الموظف"><option value="">الجميع</option><option value="me">محادثاتي</option><option value="unassigned">غير مسندة</option></select><button id="refresh">تحديث</button></div><div id="list"></div><div class="pager"><button id="prev" class="alt">السابق</button><span id="page"></span><button id="next" class="alt">التالي</button></div></section>
<section class="panel"><div id="empty">اختر محادثة لعرض الرسائل.</div><div id="chat" hidden><h2 id="title" class="chatTitle"></h2><p id="info" class="muted"></p><div class="toolbar"><button id="toggle" class="alt"></button><button id="read" class="alt">تمت القراءة</button><a id="contact" href="/contacts.html">ملف العميل</a></div><div class="toolbar" id="agentControls" hidden><select id="agent" aria-label="اسناد الموظف"></select><button id="assign" class="alt">إسناد</button></div><div class="toolbar"><input id="tags" maxlength="300" placeholder="وسوم المحادثة" aria-label="الوسوم"><button id="saveTags" class="alt">حفظ الوسوم</button></div><div id="messages" class="messages" aria-live="polite"></div><form id="send"><label>رسالة نصية</label><textarea name="text" rows="3" maxlength="4096" required placeholder="اكتب الرسالة"></textarea><button type="submit">إرسال</button><p id="window" class="muted"></p></form></div></section></div></main>
<script src="/api.js"></script><script>
(()=>{const $=id=>document.getElementById(id),api=window.ChatPlatformAPI;let rows=[],current=null,page=1,version=0,identity=null,pending=null;const status=t=>$("status").textContent=t;
$("search").value=new URLSearchParams(location.search).get("phone")||"";
function time(s){return s?new Date(s).toLocaleString("ar"): "";}
async function load(){try{rows=await api.getConversations({page,limit:25,search:$("search").value.trim(),status:$("state").value,assigned:$("assignedFilter").value});$("list").replaceChildren();for(const c of rows){const b=document.createElement("button");b.className="entry"+(current?.id===c.id?" selected":"");const n=document.createElement("strong");n.textContent=(c.contactName||c.contactPhone)+(c.unreadCount?" · "+c.unreadCount+" جديدة":"");const p=document.createElement("span");p.className="muted";p.textContent=(c.lastMessage?.text||"لا توجد رسائل")+" · "+(c.status==="closed"?"مغلقة":"مفتوحة");b.append(n,p);b.onclick=()=>select(c);$("list").append(b);}if(!rows.length)$("list").textContent="لا توجد محادثات.";$("page").textContent="صفحة "+page;$("prev").disabled=page===1;$("next").disabled=rows.length<25;if(current){const fresh=rows.find(x=>x.id===current.id);if(fresh){current=fresh;renderHeader();}}}catch(e){status(e.message);}}
function renderHeader(){if(!current)return;$("title").textContent=current.contactName||current.contactPhone;$("info").textContent=current.contactPhone+" · "+(current.assignedToUserId||"غير مسندة");$("contact").href="/contacts.html?phone="+encodeURIComponent(current.contactPhone);$("toggle").textContent=current.status==="closed"?"إعادة فتح":"إغلاق المحادثة";$("window").textContent=current.isWindowOpen?"نافذة الرد مفتوحة":"نافذة الرد مغلقة؛ استخدم قالبًا معتمدًا من صفحة الاختبار."; $("send").querySelector("button").disabled=!current.isWindowOpen; }
async function messages(){if(!current)return;const id=current.id,v=++version;try{const data=await api.getConversationMessages(id,100);if(v!==version||current?.id!==id)return;const box=$("messages");box.replaceChildren();for(const m of data){const b=document.createElement("div");b.className="bubble"+(m.direction==="Outbound"?" out":"");let full=m.textPreview;try{const raw=JSON.parse(m.contentJson);if(typeof raw.text?.body==="string")full=raw.text.body;}catch{}b.textContent=full||"["+m.messageType+"]";const small=document.createElement("small");small.textContent=time(m.timestampUtc)+" · "+m.status;b.append(small);box.append(b);}box.scrollTop=box.scrollHeight;}catch(e){if(v===version)status(e.message);}}
async function select(c){current=c;$("empty").hidden=true;$("chat").hidden=false;$("tags").value=c.tags||"";$("agent").value=c.assignedToUserId||"";$("send").reset();pending=null;renderHeader();await messages();}
async function action(name,body={}){if(!current)return;const id=current.id;try{await api.updateConversation(id,name,body);status("تم التحديث.");if(current?.id===id){if(name==="status")current.status=body.status;if(name==="assign")current.assignedToUserId=body.username;if(name==="tags")current.tags=body.tags;renderHeader();}await load();}catch(e){status(e.message);}}
$("toggle").onclick=()=>action("status",{status:current.status==="closed"?"open":"closed"});$("read").onclick=()=>action("read");$("assign").onclick=()=>action("assign",{username:$("agent").value||null});$("saveTags").onclick=()=>action("tags",{tags:$("tags").value});
$("send").onsubmit=async e=>{e.preventDefault();if(!current)return;const form=e.currentTarget,btn=form.querySelector("button"),id=current.id,text=form.text.value.trim(),phone=current.phoneNumberId,to=current.contactPhone;if(!text)return;if(!pending||pending.id!==id||pending.text!==text)pending={id,text,key:crypto.randomUUID()};const key=pending.key;btn.disabled=true;try{await api.sendMessage(to,text,{phoneNumberId:phone,idempotencyKey:key});if(current?.id===id){form.reset();pending=null;status("تمت جدولة الرسالة للإرسال.");await messages();}await load();}catch(err){status(err.message);}finally{renderHeader();}};
$("refresh").onclick=async()=>{page=1;await load();await messages();};$("state").onchange=$("assignedFilter").onchange=()=>{page=1;load();};$("prev").onclick=()=>{if(page>1){page--;load();}};$("next").onclick=()=>{page++;load();};
(async()=>{try{identity=await api.getIdentity();if(identity.role==="Admin"){const agents=await api.getTeam();$("agent").add(new Option("غير مسندة",""));for(const agent of agents.filter(a=>a.isActive))$("agent").add(new Option(agent.displayName,agent.username));$("agentControls").hidden=false;}await load();}catch(e){status(e.message);}})();
})();
</script></body></html>
