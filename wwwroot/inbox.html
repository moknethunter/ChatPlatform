<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صندوق المحادثات | ChatPlatform</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f3f6f5;color:#17392e;font-family:system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:20px 16px}nav{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:18px}a{color:#176b50}h1,h2,p{margin:0 0 12px}h1{font-size:1.6rem}h2{font-size:1.1rem}.panel{background:white;border:1px solid #dce8e1;border-radius:14px;padding:16px;min-width:0}.grid{display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2fr);gap:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}input,select,textarea,button{font:inherit;border:1px solid #b7c9c0;border-radius:8px;padding:10px;min-width:0}input,textarea,select{background:white;color:inherit}button{cursor:pointer;background:#176b50;color:white;border-color:#176b50}button.alt{background:white;color:#176b50}button:disabled{opacity:.5;cursor:default}label{display:block;font-size:.9rem;margin:12px 0 5px}form input,form textarea,form select{width:100%}.muted{color:#567267;font-size:.88rem}.entry{display:block;width:100%;text-align:right;background:white;color:#17392e;border:0;border-bottom:1px solid #dce8e1;border-radius:0;padding:14px 8px;overflow-wrap:anywhere}.entry:hover,.entry.selected{background:#e7f3ed}.entry strong{display:block}.pager{display:flex;gap:8px;align-items:center;margin-top:12px}.messages{height:420px;overflow:auto;background:#eaf0ed;padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:84%;align-self:flex-start;background:white;border-radius:12px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.out{align-self:flex-end;background:#d5efdf}.bubble small{display:block;color:#547366;margin-top:5px}.chatTitle{overflow-wrap:anywhere}.status{min-height:1.5em;color:#6e3a23}@media(max-width:720px){.grid{grid-template-columns:1fr}.messages{height:330px}main{padding:12px}.toolbar input{width:100%}}</style></head><body><main>
<nav><a href="/index.html">لوحة التحكم</a><a href="/contacts.html">إدارة العملاء</a><a href="/whatsapp.html">حسابات واتساب</a></nav><h1>صندوق المحادثات المشترك</h1><p id="status" class="status" role="status"></p><p id="live" class="muted" role="status">التحديث التلقائي: جارٍ الاتصال</p>
<div class="grid"><section class="panel"><h2>المحادثات</h2><div class="toolbar"><input id="search" placeholder="بحث بالاسم أو الرقم" aria-label="بحث"><select id="state" aria-label="حالة المحادثة"><option value="">جميع الحالات</option><option value="open">مفتوحة</option><option value="closed">مغلقة</option></select><select id="assignedFilter" aria-label="الموظف"><option value="">الجميع</option><option value="me">محادثاتي</option><option value="unassigned">غير مسندة</option></select><button id="refresh">تحديث</button></div><div id="list"></div><div class="pager"><button id="prev" class="alt">السابق</button><span id="page"></span><button id="next" class="alt">التالي</button></div></section>
<section class="panel"><div id="empty">اختر محادثة لعرض الرسائل.</div><div id="chat" hidden><h2 id="title" class="chatTitle"></h2><p id="info" class="muted"></p><div class="toolbar"><button id="toggle" class="alt"></button><button id="read" class="alt">تمت القراءة</button><a id="contact" href="/contacts.html">ملف العميل</a></div><div class="toolbar" id="agentControls" hidden><select id="agent" aria-label="اسناد الموظف"></select><button id="assign" class="alt">إسناد</button></div><div class="toolbar"><input id="tags" maxlength="300" placeholder="وسوم المحادثة" aria-label="الوسوم"><button id="saveTags" class="alt">حفظ الوسوم</button></div><div id="messages" class="messages" aria-live="polite"></div><form id="send"><label>رسالة نصية</label><textarea name="text" rows="3" maxlength="4096" required placeholder="اكتب الرسالة"></textarea><button type="submit">إرسال</button><p id="window" class="muted"></p></form><form id="mediaForm"><label>إرفاق صورة أو فيديو أو PDF أو ملف صوتي (5 MB)</label><input name="file" type="file" accept="image/jpeg,image/png,video/mp4,application/pdf,audio/ogg,audio/mpeg" required><label>تعليق اختياري</label><input name="caption" maxlength="1024"><button type="submit">إرسال المرفق</button><button type="button" id="record" hidden class="alt">تسجيل صوت</button><p id="recordHint" class="muted"></p></form></div></section></div></main>
<script src="/api.js"></script><script>
(()=>{const $=id=>document.getElementById(id),api=window.ChatPlatformAPI;let rows=[],current=null,page=1,version=0,identity=null,pending=null,mediaPending=null,sending=false,mediaSending=false,refreshing=false,listVersion=0,lastSignature=null;const status=t=>$("status").textContent=t;
$("search").value=new URLSearchParams(location.search).get("phone")||"";
function time(s){return s?new Date(s).toLocaleString("ar"): "";}
async function load(){const requestVersion=++listVersion;try{const result=await api.getConversations({page,limit:25,search:$("search").value.trim(),status:$("state").value,assigned:$("assignedFilter").value});if(requestVersion!==listVersion)return false;rows=result;$("list").replaceChildren();for(const c of rows){const b=document.createElement("button");b.className="entry"+(current?.id===c.id?" selected":"");const n=document.createElement("strong");n.textContent=(c.contactName||c.contactPhone)+(c.unreadCount?" · "+c.unreadCount+" جديدة":"");const p=document.createElement("span");p.className="muted";p.textContent=(c.lastMessage?.text||"لا توجد رسائل")+" · "+(c.status==="closed"?"مغلقة":"مفتوحة");b.append(n,p);b.onclick=()=>select(c);$("list").append(b);}if(!rows.length)$("list").textContent="لا توجد محادثات.";$("page").textContent="صفحة "+page;$("prev").disabled=page===1;$("next").disabled=rows.length<25;if(current){const fresh=rows.find(x=>x.id===current.id);if(fresh){current=fresh;renderHeader();}}return true;}catch(e){status(e.message);return false;}}
function renderHeader(){if(!current)return;$("title").textContent=current.contactName||current.contactPhone;$("info").textContent=current.contactPhone+" · "+(current.assignedToUserId||"غير مسندة");$("contact").href="/contacts.html?phone="+encodeURIComponent(current.contactPhone);$("toggle").textContent=current.status==="closed"?"إعادة فتح":"إغلاق المحادثة";$("window").textContent=current.isWindowOpen?"نافذة الرد مفتوحة":"نافذة الرد مغلقة؛ استخدم قالبًا معتمدًا من صفحة الاختبار."; $("send").querySelector("button").disabled=sending||!current.isWindowOpen;$("mediaForm").querySelector("button").disabled=mediaSending||!current.isWindowOpen; }
async function messages(){if(!current)return true;const id=current.id,v=++version;try{const data=await api.getConversationMessages(id,100);if(v!==version||current?.id!==id)return false;const signature=JSON.stringify(data.map(m=>[m.id,m.status,m.textPreview,m.messageType]));if(lastSignature===signature)return true;lastSignature=signature;const box=$("messages");const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.replaceChildren();for(const m of data){const b=document.createElement("div");b.className="bubble"+(m.direction==="Outbound"?" out":"");let full=m.textPreview;try{const raw=JSON.parse(m.contentJson);if(typeof raw.text?.body==="string")full=raw.text.body;}catch{}b.textContent=full||"["+m.messageType+"]";
if(["image","audio","video","document"].includes(m.messageType)){
 const link=document.createElement("a");link.href="/api/media/"+encodeURIComponent(m.id)+"?attachment=true";link.textContent="تنزيل المرفق";link.style.display="block";b.append(link);
 if(m.messageType!=="document"){const show=document.createElement("button");show.type="button";show.className="alt";show.textContent="عرض / تشغيل";show.onclick=()=>{const element=document.createElement(m.messageType==="image"?"img":m.messageType);element.style.maxWidth="100%";element.style.display="block";if(m.messageType!=="image")element.controls=true;element.src="/api/media/"+encodeURIComponent(m.id);element.onerror=()=>status("تعذر فتح الوسائط أو انتهت صلاحيتها.");show.replaceWith(element);};b.append(show);}
}
const small=document.createElement("small");small.textContent=time(m.timestampUtc)+" · "+(m.status==="DeliveryUnknown"?"حالة التسليم غير مؤكدة — لا تعاود الإرسال قبل التحقق":m.status);b.append(small);box.append(b);}if(atBottom)box.scrollTop=box.scrollHeight;return true;}catch(e){if(v===version)status(e.message);return false;}}
async function select(c){current=c;$("empty").hidden=true;$("chat").hidden=false;$("tags").value=c.tags||"";$("agent").value=c.assignedToUserId||"";$("send").reset();$("mediaForm").reset();$("mediaForm").file.required=true;recorded=null;recordedFor=null;if(recorder?.state==="recording")recorder.stop();pending=null;mediaPending=null;lastSignature=null;renderHeader();await messages();}
async function action(name,body={}){if(!current)return;const id=current.id;try{await api.updateConversation(id,name,body);status("تم التحديث.");if(current?.id===id){if(name==="status")current.status=body.status;if(name==="assign")current.assignedToUserId=body.username;if(name==="tags")current.tags=body.tags;renderHeader();}await load();}catch(e){status(e.message);}}
$("toggle").onclick=()=>action("status",{status:current.status==="closed"?"open":"closed"});$("read").onclick=()=>action("read");$("assign").onclick=()=>action("assign",{username:$("agent").value||null});$("saveTags").onclick=()=>action("tags",{tags:$("tags").value});
$("send").onsubmit=async e=>{e.preventDefault();if(!current)return;const form=e.currentTarget,btn=form.querySelector("button"),id=current.id,text=form.text.value.trim(),phone=current.phoneNumberId,to=current.contactPhone;if(!text)return;if(!pending||pending.id!==id||pending.text!==text)pending={id,text,key:crypto.randomUUID()};const key=pending.key;sending=true;btn.disabled=true;try{await api.sendMessage(to,text,{phoneNumberId:phone,idempotencyKey:key});if(current?.id===id){form.reset();pending=null;status("تمت جدولة الرسالة للإرسال.");await messages();}await load();}catch(err){status(err.message);}finally{sending=false;renderHeader();}};
$("mediaForm").onsubmit=async e=>{e.preventDefault();if(!current||mediaSending)return;const form=e.currentTarget,id=current.id,file=recordedFor===id&&recorded?recorded:form.file.files[0],caption=form.caption.value.trim();if(!file||file.size>5*1024*1024){status("الحد الأقصى 5 MB.");return;}mediaSending=true;renderHeader();try{if(!mediaPending||mediaPending.id!==id||mediaPending.file!==file||mediaPending.caption!==caption){const uploaded=await api.uploadMedia(id,file);mediaPending={id,file,caption,ticket:uploaded.ticket,key:crypto.randomUUID()};}const request=mediaPending;await api.sendMedia(id,request.ticket,caption,request.key);if(current?.id===id){form.reset();form.file.required=true;recorded=null;recordedFor=null;mediaPending=null;recordHint.textContent="";status("تمت جدولة المرفق.");await messages();}await load();}catch(err){status(err.message);}finally{mediaSending=false;renderHeader();}};
let recorder=null,recorded=null,recordedFor=null,recordStarted=0,recordTimer=null;
const recordBtn=$("record"),recordHint=$("recordHint");
const recordMime="audio/ogg;codecs=opus";
if(navigator.mediaDevices?.getUserMedia&&window.MediaRecorder&&MediaRecorder.isTypeSupported(recordMime)) {
 recordBtn.hidden=false;
 recordBtn.onclick=async()=>{
  if(recorder?.state==="recording"){recorder.stop();return;}
  if(!current||!current.isWindowOpen)return;
  const selected=current.id;let stream;
  try{
   stream=await navigator.mediaDevices.getUserMedia({audio:true});
   if(current?.id!==selected){stream.getTracks().forEach(t=>t.stop());return;}
   const chunks=[];let bytes=0;recorded=null;recordedFor=selected;
   recorder=new MediaRecorder(stream,{mimeType:recordMime});
   recorder.ondataavailable=e=>{bytes+=e.data.size;if(bytes<=5*1024*1024)chunks.push(e.data);else if(recorder.state==="recording")recorder.stop();};
   recorder.onstop=()=>{clearTimeout(recordTimer);stream.getTracks().forEach(t=>t.stop());recordBtn.textContent="تسجيل صوت";if(current?.id!==selected)return;if(bytes>5*1024*1024||!chunks.length){recordHint.textContent="التسجيل فارغ أو تجاوز الحد.";return;}recorded=new File(chunks,"voice.ogg",{type:"audio/ogg"});$("mediaForm").file.required=false;recordHint.textContent="تم تسجيل الصوت. اضغط إرسال المرفق لإرساله.";};
   recorder.onerror=()=>{stream.getTracks().forEach(t=>t.stop());recordHint.textContent="تعذر التسجيل.";};
   recorder.start(1000);recordStarted=Date.now();recordBtn.textContent="إيقاف التسجيل";recordHint.textContent="جاري تسجيل الصوت...";recordTimer=setTimeout(()=>{if(recorder.state==="recording")recorder.stop();},120000);
  }catch{stream?.getTracks().forEach(t=>t.stop());recordHint.textContent="تعذر الوصول إلى الميكروفون.";}
 };
}else recordHint.textContent="التسجيل المباشر غير مدعوم في هذا المتصفح؛ يمكنك إرفاق ملف صوتي.";
$("mediaForm").file.onchange=()=>{recorded=null;recordedFor=null;$("mediaForm").file.required=true;recordHint.textContent="";};
async function refreshLive(){if(document.hidden||refreshing||!identity)return;refreshing=true;try{const listOk=await load(),messagesOk=await messages();$("live").textContent=listOk&&messagesOk?"آخر تحديث تلقائي: "+new Date().toLocaleTimeString("ar"):"تعذر التحديث التلقائي؛ أعد المحاولة.";}finally{refreshing=false;}}
let live=null,liveConnected=false,revision=null,dirty=false;
function stopLive(){live?.close();live=null;liveConnected=false;}
function startLive(){
 if(!identity||document.hidden||live||!window.EventSource)return;
 live=new EventSource("/api/live/inbox");
 live.onopen=()=>{liveConnected=true;$("live").textContent="الاتصال اللحظي نشط";};
 live.addEventListener("inbox",ev=>{if(ev.data!==revision){revision=ev.data;dirty=true;if(!refreshing)drainLive();}});
 live.addEventListener("session-expired",()=>{stopLive();identity=null;location.assign("/login.html");});
 live.onerror=()=>{liveConnected=false;$("live").textContent="إعادة الاتصال؛ التحديث الاحتياطي نشط";};
}
async function drainLive(){if(document.hidden||refreshing||!dirty)return;dirty=false;await refreshLive();if(dirty)setTimeout(drainLive,0);}
setInterval(()=>{if(!liveConnected)refreshLive();else if(dirty)drainLive();},5000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopLive();else{revision=null;startLive();refreshLive();}});
window.addEventListener("pagehide",stopLive);window.addEventListener("pageshow",startLive);
$("refresh").onclick=async()=>{page=1;await load();await messages();};$("state").onchange=$("assignedFilter").onchange=()=>{page=1;load();};$("prev").onclick=()=>{if(page>1){page--;load();}};$("next").onclick=()=>{page++;load();};
(async()=>{try{identity=await api.getIdentity();if(identity.role==="Admin"){const agents=await api.getTeam();$("agent").add(new Option("غير مسندة",""));for(const agent of agents.filter(a=>a.isActive))$("agent").add(new Option(agent.displayName,agent.username));$("agentControls").hidden=false;}await load();startLive();}catch(e){status(e.message);}})();
})();
</script></body></html>
