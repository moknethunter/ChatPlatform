<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إدارة الفريق | ChatPlatform</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f7f6;color:#18382f;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px}h1{margin:0 0 8px}p{line-height:1.6}.grid{display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1.5fr);gap:16px}section{background:#fff;border:1px solid #dce6e0;border-radius:14px;padding:20px;min-width:0}label{display:block;font-weight:600;margin-top:12px}input,button{font:inherit;padding:10px;border:1px solid #a5b9b1;border-radius:8px}input{display:block;width:100%;margin-top:6px}button{cursor:pointer;background:#176b50;color:#fff;margin:8px 0;border-color:#176b50}button.secondary{background:white;color:#176b50}button:disabled{opacity:.5;cursor:wait}.agent{border-top:1px solid #e1e7e4;padding:12px 0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#536c62;font-size:.9rem}#status{min-height:1.5em}a{color:#176b50}dialog{width:min(90vw,400px);border:1px solid #dce6e0;border-radius:12px;padding:20px}dialog::backdrop{background:#10282088}@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="/platform.css"></head>
<body class="cp-app"><main><a href="/index.html">← لوحة التحكم</a><h1>إدارة الفريق</h1><p class="muted">أضف موظفي مؤسستك، وأدر صلاحية الوصول دون مشاركة حساب المدير. لا يمكن إنشاء مدير من هذه الصفحة.</p><p id="status" role="status" aria-live="polite"></p>
<div id="workspace" class="grid" hidden><section><h2>موظف جديد</h2><form id="create"><label>اسم المستخدم<input name="username" pattern="[a-z0-9._-]{3,64}" required autocomplete="off" dir="ltr"></label><label>الاسم المعروض<input name="displayName" maxlength="100" required></label><label>كلمة المرور الأولية<input name="password" type="password" minlength="14" maxlength="256" autocomplete="new-password" required></label><button type="submit">إضافة موظف</button></form></section>
<section><h2>موظفو المؤسسة</h2><div id="agents" aria-live="polite"></div></section></div>
<dialog id="reset"><form id="resetForm"><h2>تغيير كلمة المرور</h2><p id="resetName"></p><label>كلمة المرور الجديدة<input name="password" type="password" minlength="14" maxlength="256" autocomplete="new-password" required></label><button type="submit">حفظ وإلغاء الجلسات السابقة</button><button type="button" class="secondary" id="cancel">إلغاء</button></form></dialog>
</main><script src="/api.js"></script><script>
(() => {
 const byId = id => document.getElementById(id), api = window.ChatPlatformAPI;
 const status = (text) => {byId("status").textContent = text;};
 let selected = null;
 const button = (label, fn) => {const b=document.createElement("button");b.type="button";b.className="secondary";b.textContent=label;b.addEventListener("click",fn);return b;};
 async function refresh() {
  const list = byId("agents"); const agents = await api.getTeam(); list.replaceChildren();
  if (!agents.length) {list.textContent="لا توجد حسابات موظفين بعد.";return;}
  for (const agent of agents) {
   const row=document.createElement("div");row.className="agent";
   const name=document.createElement("strong");name.textContent=agent.displayName;
   const details=document.createElement("p");details.className="muted";details.textContent=agent.username+" | "+(agent.isActive?"نشط":"موقوف");
   const actions=document.createElement("div");actions.className="actions";
   actions.append(button(agent.isActive?"إيقاف":"تفعيل",async () => {try{await api.setAgentActive(agent.username,!agent.isActive);status("تم تحديث حالة الموظف.");await refresh();}catch(err){status(err.message);}}));
   actions.append(button("تغيير كلمة المرور",()=>{selected=agent.username;byId("resetName").textContent=agent.displayName;byId("resetForm").reset();byId("reset").showModal();}));
   row.append(name,details,actions);list.append(row);
  }
 }
 byId("create").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,submit=form.querySelector("button");submit.disabled=true;
  try{await api.createAgent({username:form.username.value,displayName:form.displayName.value,password:form.password.value});form.reset();status("تم إنشاء حساب الموظف.");await refresh();}catch(err){status(err.message);}finally{form.password.value="";submit.disabled=false;}
 });
 byId("resetForm").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,submit=form.querySelector("button");submit.disabled=true;
  try{await api.resetAgentPassword(selected,form.password.value);byId("reset").close();status("تم تغيير كلمة المرور وإلغاء الجلسات السابقة.");}catch(err){status(err.message);}finally{form.password.value="";submit.disabled=false;}
 });
 byId("cancel").addEventListener("click",()=>{byId("resetForm").reset();byId("reset").close();});
 (async()=>{try{const identity=await api.getIdentity();if(identity.role!=="Admin"){status("هذه الصفحة مخصصة للمدير.");return;}byId("workspace").hidden=false;await refresh();}catch(err){status(err.message);}})();
})();
</script></body></html>
