<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تسجيل الدخول | ChatPlatform</title>
<style>body{font-family:system-ui;background:#f4f7f6;color:#15352c;display:grid;place-items:center;min-height:100vh;margin:0}main{background:white;border:1px solid #dce5e1;border-radius:16px;padding:2rem;width:min(82vw,400px)}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:12px;margin:8px 0 20px;border:1px solid #9bb5ab;border-radius:8px;font:inherit}button{background:#176b50;color:white;cursor:pointer}#status{min-height:1.5em;color:#9c302e}</style><link rel="stylesheet" href="/platform.css"></head>
<body class="cp-login"><main><h1>ChatPlatform</h1><p>مساحة عمل آمنة لخدمة العملاء</p><form id="login"><label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" maxlength="100" required><label for="password">كلمة المرور</label><input type="password" id="password" name="password" autocomplete="current-password" maxlength="1024" required><button type="submit">دخول</button><p id="status" role="status"></p></form></main><script>
document.getElementById("login").addEventListener("submit", async e => {
 e.preventDefault(); const form = e.currentTarget, button = form.querySelector("button"), status = document.getElementById("status");
 button.disabled = true; status.textContent = "";
 try {
 const r = await fetch("/api/auth/login", {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json","X-ChatPlatform-CSRF":"1"},body:JSON.stringify({username:form.username.value,password:form.password.value})});
 if(r.ok){location.assign("/index.html");return;}
 status.textContent = r.status===429?"محاولات كثيرة. حاول لاحقًا.":"تعذر تسجيل الدخول. تحقق من بياناتك.";
 } catch {status.textContent="تعذر الاتصال بالخادم.";} finally {form.password.value="";button.disabled=false;}
});
</script></body></html>
