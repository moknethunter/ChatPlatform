<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الباقة والحصص | ChatPlatform</title><link rel="stylesheet" href="/platform.css"></head><body class="cp-app"><main><div class="cp-hero"><h1>الباقة والاشتراك</h1><p>حالة الاشتراك والحصص المخصصة لمؤسستك.</p></div><p id="status" role="status" class="muted"></p><section id="workspace" class="cp-section-card" hidden><h2 id="plan"></h2><p id="expiry"></p><p id="features" class="muted"></p><div id="quotas"></div><p class="muted">الرسائل تُحسب وقت الحجز حسب الشهر الميلادي بتوقيت UTC، حتى إذا أُلغي الحجز أو فشل الإرسال. لا تُحتسب إعادة محاولة نفس السجل مرتين. لا دفع تلقائي أو اشتراك خارجي للنموذج الخاص.</p><button id="refresh" class="alt">تحديث الحصص</button></section></main><script src="/api.js"></script><script>
(()=>{const $=id=>document.getElementById(id),api=window.ChatPlatformAPI;async function load(){try{const d=await api.subscription();$("plan").textContent=d.managed?(d.plan?.name||"باقة غير متاحة"):"مؤسسة سابقة بلا باقة محددة";$("expiry").textContent=d.managed?(d.active?"الاشتراك فعال":"الاشتراك غير فعال")+" · "+new Date(d.endsAtUtc).toLocaleString("ar"):"تُطبق الحدود السابقة حتى تخصيص باقة."; $("features").textContent=d.plan?"الحملات: "+(d.plan.campaigns?"متاحة":"غير متاحة")+" · اختبار النموذج الخاص: "+(d.plan.ownModel?"متاح عند ربطه":"غير متاح"):"";$("quotas").replaceChildren();for(const [key,limit,label] of [["messages","monthlyMessages","رسائل محجوزة هذا الشهر"],["agents","agents","الموظفون النشطون"],["accounts","accounts","حسابات واتساب النشطة"],["bots","bots","مسودات البوتات"],["articles","articles","مقالات المعرفة"]]){const row=document.createElement("div"),line=document.createElement("div");row.className="cp-quota";line.className="cp-quota-line";const name=document.createElement("span"),value=document.createElement("strong");const used=d.usage[key],cap=d.plan?.[limit];name.textContent=label;value.textContent=used+" / "+(cap??"غير محدد");line.append(name,value);row.append(line);if(cap!=null){const track=document.createElement("div"),fill=document.createElement("div");track.className="cp-quota-track";track.setAttribute("role","meter");track.setAttribute("aria-label",label);track.setAttribute("aria-valuemin","0");track.setAttribute("aria-valuemax",String(Math.max(1,cap)));track.setAttribute("aria-valuenow",String(Math.min(used,Math.max(1,cap))));fill.className="cp-quota-fill"+(used>=cap?" full":"");fill.style.width=(cap===0?100:Math.min(100,100*used/cap))+"%";track.append(fill);row.append(track);}$("quotas").append(row);}$("workspace").hidden=false;$("status").textContent="تم تحديث البيانات.";}catch(e){$("status").textContent=e.message;}}$("refresh").onclick=load;(async()=>{try{const u=await api.getIdentity();if(u.role!=="Admin"){$("status").textContent="هذه الصفحة لمدير المؤسسة.";return;}await load();}catch(e){$("status").textContent=e.message;}})();})();
</script></body></html>
