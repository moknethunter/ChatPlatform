<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التكاملات المركزية</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        input, textarea, select { width: 100%; padding: 10px; margin: 5px 0; background: #2d2d2d; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        button { padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 5px;}
        .delete-btn { background: #dc3545; padding: 5px 10px; width: auto; margin: 0; font-size: 12px;}
        .item { display: flex; justify-content: space-between; align-items: center; background: #2d2d2d; padding: 10px; border-radius: 5px; margin-bottom: 5px; }
        .success { color: #4caf50; }
    </style>
</head>
<body>
    <h2>🔌 منصة الربط المركزية</h2>
    <a href="/" style="color: #007bff; display: block; margin-bottom: 20px;">← العودة لتطبيق الشات</a>

    <div class="card">
        <h3>إضافة تكامل جديد (API)</h3>
        <input type="text" id="name" placeholder="اسم التكامل (مثال: Telegram Sales)">
        <input type="text" id="url" placeholder="رابط الـ API (مثال: https://api.telegram.org/bot.../sendMessage)">
        
        <select id="method">
            <option value="POST">POST</option>
            <option value="GET">GET</option>
        </select>

        <input type="text" id="authKey" placeholder="اسم الهيدر (Authorization أو X-Api-Key)" value="Authorization">
        <input type="text" id="authToken" placeholder="التوكن أو المفتاح السري (Token)">
        
        <textarea id="template" rows="3" placeholder='قالب البيانات JSON، مثال: {"chat_id":"123","text":"{Message}"}'></textarea>
        
        <button onclick="addConnector()">➕ إضافة التكامل</button>
        <p id="status" class="success"></p>
    </div>

    <div class="card">
        <h3>التكاملات النشطة</h3>
        <div id="list"></div>
    </div>

    <script>
        function loadConnectors() {
            fetch('/api/connectors').then(r => r.json()).then(data => {
                const list = document.getElementById('list');
                list.innerHTML = '';
                if (data.length === 0) list.innerHTML = '<p>لا توجد تكاملات مضافة.</p>';
                data.forEach(item => {
                    list.innerHTML += `
                        <div class="item">
                            <div><strong>${item.name}</strong><br><small style="color:#888">${item.targetUrl}</small></div>
                            <button class="delete-btn" onclick="deleteConnector('${item.id}')">حذف</button>
                        </div>
                    `;
                });
            });
        }

        function addConnector() {
            const data = {
                name: document.getElementById('name').value,
                targetUrl: document.getElementById('url').value,
                httpMethod: document.getElementById('method').value,
                authHeaderKey: document.getElementById('authKey').value,
                authToken: document.getElementById('authToken').value,
                payloadTemplate: document.getElementById('template').value
            };
            fetch('/api/connectors', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                document.getElementById('status').textContent = '✅ تمت الإضافة بنجاح!';
                loadConnectors();
            });
        }

        function deleteConnector(id) {
            fetch('/api/connectors/' + id, { method: 'DELETE' }).then(() => loadConnectors());
        }

        loadConnectors();
    </script>
</body>
</html>
