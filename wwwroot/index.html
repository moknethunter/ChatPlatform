<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; }
        #chat { height: 400px; overflow-y: auto; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .msg { padding: 8px; margin: 5px 0; background: #2d2d2d; border-radius: 6px; }
        .input-area { display: flex; gap: 5px; flex-direction: column; }
        input, select { padding: 10px; border-radius: 5px; border: none; width: 100%; box-sizing: border-box; margin-bottom: 5px;}
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; }
        .nav { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/admin.html" style="color: #007bff; text-decoration: none;">⚙️ لوحة التحكم</a>
    </div>
    
    <div id="chat"></div>
    
    <div class="input-area">
        <input type="text" id="recipient" placeholder="اسم المستلم (المسجل في لوحة التحكم)">
        <input type="text" id="msgInput" placeholder="اكتب رسالة واتساب...">
        <button onclick="sendMsg()">إرسال إلى واتساب</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
    <script>
        const chat = document.getElementById('chat');
        const conn = new signalR.HubConnectionBuilder().withUrl("/hub/chat").withAutomaticReconnect().build();

        conn.on("message.created", (evt) => {
            const div = document.createElement('div');
            div.className = 'msg';
            div.textContent = evt.payload.Text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        });

        conn.start().then(() => conn.invoke("Join", "general"));

        function sendMsg() {
            const recipient = document.getElementById('recipient').value;
            const text = document.getElementById('msgInput').value;
            if (text && recipient) {
                // إرسال الحدث مع اسم المستلم
                fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: "message.created",
                        source: "chat-app",
                        data: { Text: text, Recipient: recipient }
                    })
                });
                document.getElementById('msgInput').value = '';
            } else {
                alert("الرجاء كتابة الرسالة واسم المستلم");
            }
        }
    </script>
</body>
</html>
